name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile"

jobs:
  deploy-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/livehouseaas-api:latest

      - name: Deploy to WSO2
        run: |
          echo "Deploy to WSO2 — configure your SSH/deploy steps here"
          # ssh user@wso2-host "docker pull ... && docker compose up -d"
