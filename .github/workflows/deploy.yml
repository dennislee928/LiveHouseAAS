name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile*"
      - "docker-compose*.yml"

jobs:
  deploy-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/livehouseaas-api:latest

      - name: Deploy to WSO2
        env:
          WSO2_HOST: ${{ secrets.WSO2_HOST }}
          WSO2_SSH_KEY: ${{ secrets.WSO2_SSH_KEY }}
        run: |
          if [ -n "$WSO2_HOST" ] && [ -n "$WSO2_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$WSO2_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh -o StrictHostKeyChecking=no "deploy@$WSO2_HOST" "
              docker pull ${{ secrets.DOCKER_USERNAME }}/livehouseaas-api:latest
              docker compose -f /app/docker-compose.prod.yml up -d --no-deps api
            "
          else
            echo "WSO2_HOST or WSO2_SSH_KEY not configured — skipping deploy"
          fi
