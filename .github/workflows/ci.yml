name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: livehouse
          POSTGRES_PASSWORD: livehouse_dev
          POSTGRES_DB: livehouse_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/

      - name: Run migrations
        run: migrate -path backend/migrations -database "postgres://livehouse:livehouse_dev@localhost:5432/livehouse_dev?sslmode=disable" up
        env:
          DATABASE_URL: postgres://livehouse:livehouse_dev@localhost:5432/livehouse_dev?sslmode=disable

      - name: Verify Go code
        run: |
          cd backend
          go mod tidy
          go vet ./...
          go build ./cmd/api/

      - name: Run Go tests
        run: |
          cd backend
          go test ./... -count=1 -timeout 120s
        env:
          DATABASE_URL: postgres://livehouse:livehouse_dev@localhost:5432/livehouse_dev?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          GIN_MODE: test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npx next lint --no-cache 2>/dev/null || true
        working-directory: frontend

      - name: Build
        run: npx next build --no-lint
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
