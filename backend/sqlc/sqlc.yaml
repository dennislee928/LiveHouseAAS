version: "2"
sql:
  - schema: "../migrations"
    queries: "."
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "../internal/infra/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_methods_with_db_argument: true
