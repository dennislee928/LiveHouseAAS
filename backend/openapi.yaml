openapi: 3.0.3
info:
  title: LiveHouseAAS API
  description: Full-stack SaaS platform for Taiwanese Live House venues and independent musicians. B2B venue/booking management, B2C ticketing/payments, data analytics, NFT tickets, and business verification (KYB).
  version: 1.0.0
  contact:
    name: LiveHouseAAS Team
    url: https://livehouseaas.com

servers:
  - url: https://api.livehouseaas.com
    description: Production server
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []

paths:
  # ── Health ──
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ── Auth ──
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Reset email sent

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
              required: [token, password]
      responses:
        "200":
          description: Password reset successful

  # ── User Features ──
  /user/features/request-email-verification:
    post:
      tags: [User Features]
      summary: Request email verification
      responses:
        "200":
          description: Verification email sent

  /verify-email:
    get:
      tags: [User Features]
      summary: Verify email with token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified

  /user/features/update-profile:
    put:
      tags: [User Features]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /user/features/change-password:
    put:
      tags: [User Features]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
              required: [current_password, new_password]
      responses:
        "200":
          description: Password changed

  /user/features/update-avatar:
    post:
      tags: [User Features]
      summary: Update avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar updated

  # ── Venues ──
  /api/v1/venues:
    get:
      tags: [Venues]
      summary: List venues
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Venue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVenues"
    post:
      tags: [Venues]
      summary: Create venue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"

  /api/v1/venues/{id}:
    get:
      tags: [Venues]
      summary: Get venue by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Venue details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
    put:
      tags: [Venues]
      summary: Update venue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
      responses:
        "200":
          description: Venue updated
    delete:
      tags: [Venues]
      summary: Delete venue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Venue deleted

  /api/v1/venues/my:
    get:
      tags: [Venues]
      summary: Get my venues (artist/venue owner)
      responses:
        "200":
          description: My venues

  /api/v1/venues/{id}/specs:
    get:
      tags: [Venues]
      summary: Get venue specs
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Venue specifications
    put:
      tags: [Venues]
      summary: Update venue specs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capacity:
                  type: integer
                equipment:
                  type: string
      responses:
        "200":
          description: Specs updated

  # ── Slots ──
  /api/v1/venues/{id}/slots:
    get:
      tags: [Slots]
      summary: Get venue slots (calendar)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Slot list
    post:
      tags: [Slots]
      summary: Create slots for venue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSlotsRequest"
      responses:
        "201":
          description: Slots created

  /api/v1/slots/{slotId}/book:
    post:
      tags: [Slots]
      summary: Book a slot
      parameters:
        - name: slotId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Slot booked

  # ── Bookings ──
  /api/v1/bookings:
    get:
      tags: [Bookings]
      summary: List my bookings
      responses:
        "200":
          description: Booking list
    post:
      tags: [Bookings]
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                venue_id:
                  type: integer
                slot_ids:
                  type: array
                  items:
                    type: integer
                message:
                  type: string
              required: [venue_id, slot_ids]
      responses:
        "201":
          description: Booking created

  /api/v1/bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get booking details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /api/v1/bookings/{id}/status:
    put:
      tags: [Bookings]
      summary: Update booking status (approve/reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [approved, rejected, confirmed]
              required: [status]
      responses:
        "200":
          description: Booking status updated

  # ── Events ──
  /api/v1/events:
    get:
      tags: [Events]
      summary: List events
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEvents"
    post:
      tags: [Events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                venue_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date-time
              required: [venue_id, title, date]
      responses:
        "201":
          description: Event created

  /api/v1/events/{id}:
    get:
      tags: [Events]
      summary: Get event details
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event details
    put:
      tags: [Events]
      summary: Update event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event updated
    delete:
      tags: [Events]
      summary: Delete event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Event deleted

  /api/v1/events/{id}/publish:
    post:
      tags: [Events]
      summary: Publish event (requires ticket types)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event published

  /api/v1/events/{id}/ticket-types:
    get:
      tags: [Events]
      summary: Get ticket types for event
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket types list

  # ── Ticket Types ──
  /api/v1/events/{eventId}/ticket-types:
    post:
      tags: [Ticket Types]
      summary: Create ticket type
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketTypeRequest"
      responses:
        "201":
          description: Ticket type created

  /api/v1/ticket-types/{id}:
    put:
      tags: [Ticket Types]
      summary: Update ticket type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketTypeRequest"
      responses:
        "200":
          description: Ticket type updated
    delete:
      tags: [Ticket Types]
      summary: Delete ticket type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Ticket type deleted

  # ── Orders ──
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List my orders
      responses:
        "200":
          description: Order list
    post:
      tags: [Orders]
      summary: Create order (purchase tickets)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: integer
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      ticket_type_id:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
                    required: [ticket_type_id, quantity]
                payment_method:
                  type: string
                  enum: [mock, ecpay, newebay, crypto_binance, crypto_evm]
              required: [event_id, items, payment_method]
      responses:
        "201":
          description: Order created

  # ── Tickets ──
  /api/v1/tickets:
    get:
      tags: [Tickets]
      summary: Get my tickets
      responses:
        "200":
          description: My tickets

  /api/v1/tickets/{id}:
    get:
      tags: [Tickets]
      summary: Get ticket details
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket details

  /api/v1/tickets/{id}/qr:
    get:
      tags: [Tickets]
      summary: Get ticket QR code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: QR code image (PNG)

  # ── QR Verification ──
  /api/v1/verify/lookup:
    post:
      tags: [QR Verification]
      summary: Lookup ticket by QR code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                qr_secret:
                  type: string
              required: [code, qr_secret]
      responses:
        "200":
          description: Ticket info

  /api/v1/verify/checkin:
    post:
      tags: [QR Verification]
      summary: Verify and check in ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                qr_secret:
                  type: string
              required: [code, qr_secret]
      responses:
        "200":
          description: Ticket verified and checked in

  # ── NFT ──
  /api/v1/nft/claim:
    post:
      tags: [NFT]
      summary: Claim NFT ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket_id:
                  type: integer
                wallet_address:
                  type: string
              required: [ticket_id, wallet_address]
      responses:
        "200":
          description: NFT minted

  /api/v1/nft/poap/{ticketId}:
    get:
      tags: [NFT]
      summary: Get POAP (proof of attendance) for ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: POAP metadata

  /api/v1/nft/status/{ticketId}:
    get:
      tags: [NFT]
      summary: Get NFT minting status for ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: NFT status

  # ── KYB ──
  /api/v1/kyb/submit:
    post:
      tags: [KYB]
      summary: Submit KYB verification
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                business_name:
                  type: string
                registration_number:
                  type: string
                documents:
                  type: array
                  items:
                    type: string
                    format: binary
              required: [business_name, registration_number]
      responses:
        "201":
          description: KYB submitted

  /api/v1/kyb/status:
    get:
      tags: [KYB]
      summary: Get my KYB status
      responses:
        "200":
          description: KYB status

  # ── Dashboard ──
  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics (role-based)
      responses:
        "200":
          description: Dashboard stats

  # ── Admin ──
  /api/v1/admin/stats:
    get:
      tags: [Admin]
      summary: Admin platform statistics
      responses:
        "200":
          description: Platform stats

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List all users
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated user list

  /api/v1/admin/users/{id}/role:
    put:
      tags: [Admin]
      summary: Update user role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, artist, venue, admin]
              required: [role]
      responses:
        "200":
          description: Role updated

  /api/v1/admin/venues:
    get:
      tags: [Admin]
      summary: List all venues (admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated venues

  /api/v1/admin/venues/{id}/status:
    put:
      tags: [Admin]
      summary: Update venue status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended]
              required: [status]
      responses:
        "200":
          description: Venue status updated

  /api/v1/admin/events:
    get:
      tags: [Admin]
      summary: List all events (admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated events

  /api/v1/admin/bookings:
    get:
      tags: [Admin]
      summary: List all bookings (admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated bookings

  /api/v1/admin/orders:
    get:
      tags: [Admin]
      summary: List all orders (admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated orders

  /api/v1/admin/kyb:
    get:
      tags: [Admin]
      summary: List pending KYB verifications
      responses:
        "200":
          description: Pending KYB list

  /api/v1/admin/kyb/{id}/verify:
    post:
      tags: [Admin]
      summary: Verify KYB application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [verify, reject]
                  description: verify or reject
                notes:
                  type: string
              required: [action]
      responses:
        "200":
          description: KYB reviewed

  /api/v1/admin/notifications:
    get:
      tags: [Admin]
      summary: List all notifications (admin view)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: user_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Notification history

  /api/v1/admin/notifications/broadcast:
    post:
      tags: [Admin]
      summary: Send broadcast notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: [all, venues, artists, user]
                user_id:
                  type: integer
                  description: Required if target is "user"
                title:
                  type: string
                body:
                  type: string
              required: [target, title, body]
      responses:
        "200":
          description: Broadcast sent

  # ── Analytics ──
  /api/v1/analytics/revenue:
    get:
      tags: [Analytics]
      summary: Revenue over time
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: monthly
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Revenue data

  /api/v1/analytics/top-venues:
    get:
      tags: [Analytics]
      summary: Top venues by revenue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top venues

  /api/v1/analytics/top-events:
    get:
      tags: [Analytics]
      summary: Top events by revenue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top events

  /api/v1/analytics/booking-trends:
    get:
      tags: [Analytics]
      summary: Booking trends over time
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: monthly
      responses:
        "200":
          description: Booking trends

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Analytics summary
      responses:
        "200":
          description: Summary data

  /api/v1/analytics/venue-performance:
    get:
      tags: [Analytics]
      summary: Venue performance metrics
      responses:
        "200":
          description: Venue performance

  # ── Notifications ──
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List my notifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Notification list

  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      responses:
        "200":
          description: Unread count

  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
