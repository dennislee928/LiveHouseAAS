    put:
      tags: [Seat Maps]
      summary: Save venue seat layout
      parameters:
        - name: venueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                layout:
                  type: object
              required: [layout]
      responses:
