          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
              required: [amount]
      responses:
        "200":
          description: Refund processed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, artist, venue, admin]
        email_verified:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        role:
          type: string
          enum: [user, artist, venue]
      required: [email, password, name, role]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PaginatedVenues:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Venue:
      type: object
      properties:
        id:
          type: integer
        owner_id:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time

    CreateVenueRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        description:
          type: string
      required: [name, address, city]

    CreateSlotsRequest:
      type: object
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              start_time:
                type: string
                format: date-time
              end_time:
                type: string
                format: date-time
              status:
                type: string
                enum: [available, blocked]
            required: [start_time, end_time]

    Booking:
      type: object
      properties:
        id:
          type: integer
        venue_id:
          type: integer
        artist_id:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected, confirmed]
        message:
          type: string
        created_at:
          type: string
          format: date-time

    PaginatedEvents:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Event:
      type: object
      properties:
        id:
          type: integer
        venue_id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, published, cancelled]
        created_at:
          type: string
          format: date-time

    CreateTicketTypeRequest:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer
          minimum: 1
        description:
          type: string
      required: [name, price, quantity]
