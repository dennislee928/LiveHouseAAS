version: "3.9"

name: livehouseaas-prod

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      GIN_MODE: release
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: "${CORS_ORIGIN:-https://app.livehouseaas.com}"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-25}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-5}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      FROM_EMAIL: "${FROM_EMAIL:-noreply@livehouseaas.com}"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
